steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/medi-path/archivist:$COMMIT_SHA', './archivist']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/medi-path/archivist:$COMMIT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'archivist'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/medi-path/archivist:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-secrets=GOOGLE_API_KEY=GOOGLE_API_KEY:latest,FIRESTORE_PROJECT_ID=FIRESTORE_PROJECT_ID:latest'
